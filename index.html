<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAcademy</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="main.css" />
</head>

<body>
  <!-- Header -->
  <header>
    <div id="header-bar" class="header d-flex justify-content-between align-items-center px-4 py-2">
      <a href="#/" class="text-decoration-none">
        <img src="img/logo_amarillo_sin_fondo.png" alt="Logo" class="logo" />
      </a>

      <nav>
        <ul class="d-flex list-unstyled m-0">
          <li class="mx-3">
            <a href="#/courses" class="nav-link">Cursos</a>
          </li>
          <li class="mx-3">
            <a href="#/ourclients" class="nav-link">Nuestros clientes</a>
          </li>
          <li class="mx-3">
            <a href="#/contacto" class="nav-link">Contacto</a>
          </li>
          <li>
            <a href="#/admin" class="nav-link">Admin</a>
          </li>
        </ul>
      </nav>
      <hr />
    </div>
  </header>

  <!-- Contenedor SPA -->
  <div id="app">
    <!-- Aquí se cargarán las vistas -->
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="row">
        <div class="col-md-4 mb-3 mb-md-0">
          <h5>SÍGUENOS EN:</h5>
          <a href="#" target="_blank" rel="noopener noreferrer">
            <img src="img/tik-tok.png" alt="TikTok" class="footer-icon" />
          </a>
          <a href="#" target="_blank" rel="noopener noreferrer">
            <img src="img/instagram.png" alt="Instagram" class="footer-icon" />
          </a>
        </div>
        <div class="col-md-4 mb-3 mb-md-0">
          <h5>AYUDA</h5>
          <ul class="list-unstyled">
            <li><a href="#/contacto" class="footer-link">Contacto</a></li>
          </ul>
        </div>
        <div class="col-md-4">
          <h5>Servicios</h5>
          <ul class="list-unstyled">
            <li>
              <a href="#/aviso-legal" class="footer-link">Aviso Legal</a>
            </li>
            <li>
              <a href="#/politica-privacidad" class="footer-link">Política de Privacidad</a>
            </li>
            <li>
              <a href="#/cookies" class="footer-link">Política de Cookies</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="container text-center mt-3">
      <p>&copy; 2025 Cursos Online. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/courses.js"></script>


  <!-- Router SPA -->
  <script>
    function router() {
      const ruta = window.location.hash;

      if (ruta === "#/contacto") {
        cargarVista("backend/contacto.html", () => {
          const script = document.createElement("script");
          script.type = "module";
          script.src = "js/contacto.js";
          script.onload = () => {
            import('./js/contacto.js').then(module => module.initContactoForm());
          };
          document.body.appendChild(script);
        });
      } else if (ruta === "#/courses") {
        cargarVista("backend/courses.html", () => {
          initCourses();
        });
      } else if (ruta.startsWith("#/course/")) {
        const courseId = Number(ruta.split("/")[2]); // aseguramos número
        cargarVista("backend/course-detail.html", async () => {
          try {
            const module = await import("./js/course-detail.js");
            module.initCourseDetail(courseId);
          } catch (err) {
            console.error("Error cargando course-detail.js:", err);
            document.getElementById("app").innerHTML = "<p>Error cargando el curso.</p>";
          }
        });
      }
      else if (ruta === "#/ourclients") {
        cargarVista("backend/ourclients.html", () => {
          import("./js/ourclients.js")
            .then(module => module.initCarousel());
        });
      }
      else if (ruta === "#/admin") {
        //Importamos aqui el admin.js para que el script se ejecute despues de que el 
        cargarVista("backend/admin.html", () => {
          import('./js/admin.js').then(module => module.initAdminPanel());
        });
      } else {
        cargarInicio();
      }
    }

    function cargarVista(vista, callback) {
      fetch(vista)
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("app").innerHTML = html;
          if (typeof callback === "function") callback();
        })
        .catch((err) => {
          console.error("ERROR EN FETCH:", err);
          document.getElementById("app").innerHTML =
            "<p>Error al cargar la vista.</p>";
        });
    }

    function cargarInicio() {
      cargarVista("backend/home.html", () => {
        // Inicializar el modal después de que home.html esté en el DOM
        import('./js/presupuesto.js').then(module => module.initPresupuestoModal());
      });
    }


    window.addEventListener("hashchange", router);
    window.addEventListener("load", router);
  </script>

  <!-- Modal Presupuesto -->
  <div id="modal-presupuesto" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <span id="modal-close" class="modal-close">&times;</span>
      <h3>Solicitar Presupuesto</h3>
      <form id="form-presupuesto-modal">
        <div class="mb-3">
          <label for="nombre-modal" class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="nombre-modal" name="nombre" required>
        </div>
        <div class="mb-3">
          <label for="email-modal" class="form-label">Correo electrónico:</label>
          <input type="email" class="form-control" id="email-modal" name="email" required>
        </div>
        <div class="mb-3">
          <label for="mensaje-modal" class="form-label">Mensaje:</label>
          <textarea class="form-control" id="mensaje-modal" name="mensaje" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar Presupuesto</button>
      </form>
    </div>
  </div>

  <style>
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>

</body>

</html>
