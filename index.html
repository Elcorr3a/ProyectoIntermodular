<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAcademy</title>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div
        id="header-bar"
        class="header d-flex justify-content-between align-items-center px-4 py-2"
      >
        <a href="#/" class="text-decoration-none">
          <img src="img/logo_amarillo_sin_fondo.png" alt="Logo" class="logo" />
        </a>

        <nav>
          <ul class="d-flex list-unstyled m-0">
            <li class="mx-3">
              <a href="#/courses" class="nav-link">Cursos</a>
            </li>
            <li class="mx-3">
              <a href="#/ourclients" class="nav-link">Nuestros clientes</a>
            </li>
            <li class="mx-3">
              <a href="#/contacto" class="nav-link">Contacto</a>
            </li>
          </ul>
        </nav>
        <hr />
      </div>
    </header>

    <!-- Contenedor SPA -->
    <div id="app">
      <!-- Aquí se cargarán las vistas -->
    </div>

    <!-- Footer -->
    <footer>
      <div class="container">
        <div class="row">
          <div class="col-md-4 mb-3 mb-md-0">
            <h5>SÍGUENOS EN:</h5>
            <a href="#" target="_blank" rel="noopener noreferrer">
              <img 
                src="img/tik-tok.png" 
                alt="TikTok" 
                class="footer-icon" 
              />
            </a>
            <a href="#" target="_blank" rel="noopener noreferrer">
              <img
                src="img/instagram.png"
                alt="Instagram"
                class="footer-icon"
              />
            </a>
          </div>
          <div class="col-md-4 mb-3 mb-md-0">
            <h5>AYUDA</h5>
            <ul class="list-unstyled">
              <li><a href="#/contacto" class="footer-link">Contacto</a></li>
            </ul>
          </div>
          <div class="col-md-4">
            <h5>Servicios</h5>
            <ul class="list-unstyled">
              <li>
                <a href="#/aviso-legal" class="footer-link">Aviso Legal</a>
              </li>
              <li>
                <a href="#/politica-privacidad" class="footer-link"
                  >Política de Privacidad</a
                >
              </li>
              <li>
                <a href="#/cookies" class="footer-link">Política de Cookies</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <div class="container text-center mt-3">
        <p>&copy; 2025 Cursos Online. Todos los derechos reservados.</p>
      </div>
    </footer>

 <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="carousel.js"></script>
<script src="courses.js"></script>


    <!-- Router SPA -->
    <script>
      function router() {
        const ruta = window.location.hash;

        if (ruta === "#/contacto") {
          cargarVista("contacto.html");
        } else if (ruta === "#/courses") {
          cargarVista("courses.html", () => initCourses());
        } else if (ruta === "#/ourclients") {
          cargarVista("ourclients.html", () => {
            const script = document.createElement("script");
            script.src = "carousel.js";
            script.onload = () => {
              initCarousel(); // se llama cuando el script ya está cargado
            };
            document.body.appendChild(script);
          });
        } else {
          cargarInicio();
        }
      }

      function cargarVista(vista, callback) {
        fetch(vista)
          .then((res) => res.text())
          .then((html) => {
            document.getElementById("app").innerHTML = html;
            if (typeof callback === "function") callback();
          })
          .catch((err) => {
            console.error("ERROR EN FETCH:", err);
            document.getElementById("app").innerHTML =
              "<p>Error al cargar la vista.</p>";
          });
      }

      function cargarInicio() {
        cargarVista("home.html");
      }

      window.addEventListener("hashchange", router);
      window.addEventListener("load", router);
    </script>
  </body>
</html>
