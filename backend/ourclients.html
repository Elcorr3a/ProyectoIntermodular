<section id="clients-section">
  <h2 class="section-title">Nuestros Clientes</h2>
  <p class="section-description">
    Nos enorgullece trabajar con clientes que confían en nosotros. 
    Aquí compartimos algunas de sus opiniones sobre nuestros servicios.
  </p>
  <div class="carousel-container">
    <div class="swiper mySwiper">
      <div class="swiper-wrapper" id="carousel-wrapper">
        <!-- Los slides se generarán aquí dinámicamente -->
      </div>
      <div class="swiper-button-next">→</div>
      <div class="swiper-button-prev">←</div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>
<div class="comment-form">
  <h3>Deja tu comentario</h3>

  <input
    id="client-name"
    type="text"
    placeholder="Tu nombre"
  >

  <textarea
    id="client-message"
    placeholder="Tu comentario"
  ></textarea>

  <button id="send-comment">
    Enviar comentario
  </button>
</div>
</body>
</html>
